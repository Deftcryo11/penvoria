<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11796f" />

    <title>Reset Password | Penvoria</title>

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <script src="theme.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <section class="auth-screen">
      <div class="auth-card">
        <div class="auth-brand">
          <span class="auth-logo">◈</span>

          <div>
            <h1>Penvoria</h1>
            <p>Your money. Your plan.</p>
          </div>
        </div>

        <h2 id="resetHeading">Reset your password</h2>

        <p id="resetIntro" class="auth-subtitle">
          Enter the email address linked to your Penvoria account.
        </p>

        <!-- REQUEST RESET EMAIL -->
        <form id="requestForm">
          <div class="field">
            <label for="resetEmail"> Email address </label>

            <input
              id="resetEmail"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <button id="requestButton" class="primary auth-submit" type="submit">
            Send reset link
          </button>
        </form>

        <!-- SET NEW PASSWORD -->
        <form id="changeForm" hidden>
          <div class="field">
            <label for="newPassword"> New password </label>

            <input
              id="newPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>

          <div class="field">
            <label for="confirmPassword"> Confirm new password </label>

            <input
              id="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>

          <button id="changeButton" class="primary auth-submit" type="submit">
            Update password
          </button>
        </form>

        <p
          id="resetMessage"
          class="auth-message"
          role="status"
          aria-live="polite"
        ></p>

        <p class="auth-switch">
          <a
            href="index.html"
            style="
              color: var(--accent);
              font-weight: 700;
              text-decoration: none;
            "
          >
            Back to sign in
          </a>
        </p>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <script>
      "use strict";

      const heading = document.getElementById("resetHeading");

      const intro = document.getElementById("resetIntro");

      const requestForm = document.getElementById("requestForm");

      const changeForm = document.getElementById("changeForm");

      const messageBox = document.getElementById("resetMessage");

      const requestButton = document.getElementById("requestButton");

      const changeButton = document.getElementById("changeButton");

      const config = window.PENVORIA_CONFIG;

      let client = null;

      function status(text, isError = false) {
        messageBox.textContent = text;

        messageBox.classList.toggle("auth-error", isError);
      }

      function showChangeForm() {
        requestForm.hidden = true;
        changeForm.hidden = false;

        heading.textContent = "Choose a new password";

        intro.textContent =
          "Use a new password with at least eight characters.";

        status("");
      }

      function showRequestForm() {
        requestForm.hidden = false;
        changeForm.hidden = true;

        heading.textContent = "Reset your password";

        intro.textContent =
          "Enter the email address linked to your Penvoria account.";
      }

      async function initialize() {
        try {
          if (
            !config?.url ||
            !config?.publishableKey ||
            typeof window.supabase?.createClient !== "function"
          ) {
            throw new Error("Penvoria authentication is unavailable.");
          }

          client = window.supabase.createClient(
            config.url,
            config.publishableKey,
          );

          // Detect a valid password recovery link.
          client.auth.onAuthStateChange((event, session) => {
            if (event === "PASSWORD_RECOVERY" && session) {
              showChangeForm();
            }
          });

          const returningFromEmail =
            new URLSearchParams(window.location.search).get("mode") ===
              "update" ||
            new URLSearchParams(window.location.hash.slice(1)).get("type") ===
              "recovery";

          if (returningFromEmail) {
            const { data, error } = await client.auth.getSession();

            if (error || !data.session) {
              showRequestForm();

              status(
                "Reset link expired or invalid. Request a new email.",
                true,
              );
            } else {
              showChangeForm();
            }
          }
        } catch (error) {
          status(error.message, true);
          requestButton.disabled = true;
        }
      }

      /* =====================================
       SEND RESET EMAIL
       ===================================== */

      requestForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!client) return;

        requestButton.disabled = true;
        status("Sending reset email...");

        try {
          const redirect = new URL(
            "reset-password.html?mode=update",
            window.location.href,
          );

          const { error } = await client.auth.resetPasswordForEmail(
            document.getElementById("resetEmail").value.trim(),
            {
              redirectTo: redirect.href,
            },
          );

          if (error) throw error;

          status(
            "If an account exists for that email, " +
              "a reset link will be sent. " +
              "Check your inbox and spam folder.",
          );
        } catch (error) {
          status(error.message || "Could not send reset email.", true);
        } finally {
          requestButton.disabled = false;
        }
      });

      /* =====================================
       UPDATE PASSWORD
       ===================================== */

      changeForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!client) return;

        const password = document.getElementById("newPassword").value;

        const confirm = document.getElementById("confirmPassword").value;

        if (password.length < 8) {
          status("Enter at least eight characters.", true);
          return;
        }

        if (password !== confirm) {
          status("Passwords do not match.", true);
          return;
        }

        changeButton.disabled = true;
        status("Updating password...");

        try {
          const { data: user, error: userError } = await client.auth.getUser();

          if (userError || !user.user) {
            throw new Error("Your reset link expired. Please request another.");
          }

          const { error } = await client.auth.updateUser({
            password,
          });

          if (error) throw error;

          changeForm.reset();

          // Remove recovery parameters from URL.
          window.history.replaceState(null, "", "reset-password.html");

          // End the recovery session locally.
          const { error: signOutError } = await client.auth.signOut({
            scope: "local",
          });

          if (signOutError) {
            throw signOutError;
          }

          changeForm.hidden = true;
          requestForm.hidden = true;

          heading.textContent = "Password updated";

          intro.textContent = "You can now sign in with your new password.";

          status("Your password was changed successfully.");
        } catch (error) {
          status(error.message || "Could not update password.", true);
        } finally {
          changeButton.disabled = false;
        }
      });

      void initialize();
    </script>
  </body>
</html>
