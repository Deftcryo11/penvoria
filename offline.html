<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width,
             initial-scale=1,
             viewport-fit=cover"
    />

    <title>Penvoria — Offline</title>

    <meta name="theme-color" content="#11796f" />

    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f5f8f9;
        color: #1b3541;
        padding: 20px;
        box-sizing: border-box;
      }

      main {
        max-width: 430px;
        text-align: center;
        background: #ffffff;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 10px 35px #0001;
      }

      h1 {
        margin-top: 0;
      }

      p {
        line-height: 1.55;
      }

      a {
        display: inline-block;
        background: #11796f;
        color: #ffffff;
        padding: 11px 20px;
        text-decoration: none;
        border-radius: 10px;
        margin-top: 8px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #101c25;
          color: #ebf5f6;
        }

        main {
          background: #192b36;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Penvoria is offline</h1>

      <p>
        Reconnect to the internet to securely sign in and load your financial
        records.
      </p>

      <p>
        If you already have Penvoria open with unsynced changes, keep that tab
        open until it finishes syncing.
      </p>

      <a href="./">Try again</a>
    </main>
  </body>
</html>
